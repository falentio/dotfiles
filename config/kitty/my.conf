# -----------------------------------------------------------------------------
# Fonts
# -----------------------------------------------------------------------------
# Font family. You can use any font installed on your system.
# I recommend using a Nerd Font for better integration with tools like oh-my-zsh
# or starship that use icons. Monaspace Neon NF includes Nerd Font symbols.
font_family      Monaspace Neon NF
italic_font      auto
bold_font        auto
bold_italic_font auto

# Font size in points.
font_size 12.0

# -----------------------------------------------------------------------------
# Cursor
# -----------------------------------------------------------------------------
# The shape of the cursor. Can be block, beam, or underline.
cursor_shape block

# Stop blinking cursor after specified number of seconds. 0 to disable.
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# -----------------------------------------------------------------------------
# Scrollback
# -----------------------------------------------------------------------------
# Number of lines of scrollback to keep in memory.
scrollback_lines 2000

# -----------------------------------------------------------------------------
# Mouse
# -----------------------------------------------------------------------------
# Hide mouse cursor after a period of inactivity.
mouse_hide_wait 3.0

# Copy to clipboard when text is selected.
copy_on_select yes

# -----------------------------------------------------------------------------
# Terminal bell
# -----------------------------------------------------------------------------
# Disable the audible bell. It can be annoying.
enable_audio_bell no

# Visual bell duration in seconds.
visual_bell_duration 0.1

# -----------------------------------------------------------------------------
# Window layout
# -----------------------------------------------------------------------------
# The padding on the sides of each window.
window_padding_width 5

# Hide the OS window decorations (title bar/borders).
hide_window_decorations yes

# The layout for new windows.
# You can cycle through layouts with ctrl+shift+l.
enabled_layouts tall,stack,fat,grid,horizontal,vertical

# -----------------------------------------------------------------------------
# Tab bar
# -----------------------------------------------------------------------------
# Where to draw the tab bar. Can be top or bottom.
tab_bar_edge bottom

# The style of the tab bar.
tab_bar_style powerline

# -----------------------------------------------------------------------------
# Color scheme
# -----------------------------------------------------------------------------
# zedokai-filter-machine
include themes/zedokai-filter-machine.conf

# -----------------------------------------------------------------------------
# Advanced
# -----------------------------------------------------------------------------
# Allow remote control of kitty. Useful for plugins.
allow_remote_control yes

# Open URLs with the default browser.
open_url_with default

# -----------------------------------------------------------------------------
# Key mappings
# -----------------------------------------------------------------------------
# Clear terminal screen
map ctrl+shift+k clear_terminal

# Next tab
map alt+2 next_tab

# Previous tab
map alt+1 previous_tab
map ctrl+tab previous_tab
